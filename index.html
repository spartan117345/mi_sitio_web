<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi sitio web</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <style>
        body {
            background-color: rgb(0, 0, 255); 
            color: white; 
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 15px;
            text-align: center;
            vertical-align: middle;
        }
        img {
            width: 100px;
            height: 100px;
            display: block;
            margin: 0 auto 10px auto; 
            border: 2px solid white; 
            border-radius: 8px;
            transition: transform 0.2s;
        }
        img:hover {
            transform: scale(1.05); 
        }
        a {
            color: #ffff00; 
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Sitio web de Julian</h1>

    <table>
        <tr>
            <th>Nacimiento</th>
            <th>Familia</th>
            <th>Educación</th>
            <th>Amigos</th>
            <th>Hobbies</th>
            <th>Música</th>
            <th>Horarios</th>
            <th>Proyecto de vida</th>
        </tr>
        <tr>
            <td>
                <a href="nacimiento.html">
                    <img src="img/nacimiento.png" alt="nacimiento">
                    Ver Nacimiento
                </a>
            </td>
            <td>
                <a href="familia.html">
                    <img src="img/familia.png" alt="familia">
                    Ver Familia
                </a>
            </td>
            <td>
                <a href="educacion.html">
                    <img src="img/educacion.jpeg" alt="educación">
                    Ver Educación
                </a>
            </td>
            <td>
                <a href="amigos.html">
                    <img src="img/amigos.jpeg" alt="amigos">
                    Ver Amigos
                </a>
            </td>
            <td>
                <a href="hobbies.html">
                    <img src="img/hobbies.png" alt="hobbies">
                    Ver Hobbies
                </a>
            </td>
            <td>
                <a href="musica.html">
                    <img src="img/musica.png" alt="música">
                    Ver Música
                </a>
            </td>
            <td>
                <a href="horario.html">
                    <img src="img/horario.png" alt="horarios">
                    Ver Horarios
                </a>
            </td>
            <td>
                <a href="proyecto_vida.html">
                    <img src="img/proyecto_vida.jpeg" alt="proyecto de vida">
                    Ver Proyecto
